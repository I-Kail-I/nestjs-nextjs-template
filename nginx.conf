events {
    worker_connections 1024;
}

http {
    upstream nextjs_upstream {
        server frontend:3000;
    }

    upstream nestjs_upstream {
        server backend:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Max body size for file uploads
        client_max_body_size 50M;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # API routes - NestJS backend
        location /api {
            rewrite ^/api/(.*) /$1 break;
            
            proxy_pass http://nestjs_upstream;
            
            # WebSocket support (if needed)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # API documentation (optional - if you use Swagger)
        location /api/docs {
            rewrite ^/api/docs/(.*) /docs/$1 break;
            proxy_pass http://nestjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Frontend routes
        location / {
            proxy_pass http://nextjs_upstream;
            
            # Next.js specific settings
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Next.js cache busting
            proxy_cache_bypass $http_upgrade;
            
            # Timeouts for Next.js (SSR/SSG)
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Static files caching (optional - for better performance)
        location /_next/static {
            proxy_pass http://nextjs_upstream;
            proxy_cache_valid 200 60m;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Health check endpoint
        location /health {
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}