services:
  backend:
    build:
      context: ./backend
      target: prod
    container_name: Backend_prod
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      - PORT=${BACKEND_PORT}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=${NODE_ENV}
      - FRONTEND_URL=${FRONTEND_URL}
      - REDIS_URL=${REDIS_URL}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:{BACKEND_PORT}/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      target: prod
    container_name: Frontend_prod
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      - API_URL=${API_URL}
      - NEXT_PUBLIC_API_PREFIX=${NEXT_PUBLIC_API_PREFIX}
      - PORT=${FRONTEND_PORT}
      - NODE_ENV=${NODE_ENV}
