services:
  database:
    image: postgres:17
    container_name: Database_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-networks
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: prod
    container_name: Backend_prod
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - upload_folder:/app/uploads
    networks:
      - app-networks

  frontend:
    build:
      context: ./frontend
      target: prod
    container_name: Frontend_prod
    restart: unless-stopped
    env_file: ./frontend/.env
    depends_on:
      - backend
    networks:
      - app-networks

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: Nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - app-networks  # ← THIS WAS MISSING!

networks:
  app-networks:
    driver: bridge

volumes:
  postgres_data:
  upload_folder: